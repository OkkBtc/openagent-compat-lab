[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-compat-lab"
version = "0.2.0"
description = "Deterministic compatibility checks for Codex, Hermes, OpenClaw, and OpenAI-style LLM endpoints"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "requests",
    "pytest",
]

[project.optional-dependencies]
dev = ["build", "ruff"]

[project.scripts]
agent-compat = "mcs.cli:main"
mcs = "mcs.cli:main"

[project.urls]
Homepage = "https://github.com/OkkBtc/agent-compat-lab"
Issues = "https://github.com/OkkBtc/agent-compat-lab/issues"
Source = "https://github.com/OkkBtc/agent-compat-lab"

[tool.setuptools.packages.find]
include = ["mcs*"]

[tool.setuptools.package-data]
# Ship the multimodal fixture images/audio in the wheel (needed by the remote
# pip-install flow, not just a source checkout).
mcs = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "mcs/suites"]
python_files = ["*.py"]
markers = [
    "core: API contract basics",
    "special_tokens: BOS/EOS ownership across tokenization paths",
    "streaming: SSE streaming behavior",
    "tools: function / tool calling",
    "multimodal: image and audio inputs",
    "multiturn: multi-turn conversation state",
    "reasoning: <think> / inner-monologue handling",
    "robustness: chat-template injection & error paths",
    "perf: performance smoke (excluded from default run)",
    "dev: needs non-OpenAI extension endpoints (/tokenize, /detokenize); included by --spec dev",
]
addopts = "-ra -m 'not perf'"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# Defaults (E, F) + import sorting (I) + pyupgrade (UP) + bugbear (B).
extend-select = ["I", "UP", "B"]
